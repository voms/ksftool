# Draws the dashboard from ksf.surf's live data on a fresh machine and keeps the pictures: a check that KSF Companion
# still reads ksf.surf right, and screenshots for docs/. Run it by hand from the Actions tab (it also runs when this
# file changes).
name: Screenshots

on:
  workflow_dispatch:
    inputs:
      map:
        description: 'Also draw this map and print its KSF card (e.g. surf_bugs)'
        required: false
        default: ''
      api:
        description: 'Or just print what ksf.surf answers at these paths (e.g. /api/maps/search/surf_bugs; for a page, the API paths it uses)'
        required: false
        default: ''
  push:
    paths: ['.github/workflows/screenshots.yml']

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Print what ksf.surf answers
        if: inputs.api != ''
        env:
          API: ${{ inputs.api }}
        run: |
          read -ra paths <<<"$API"
          for path in "${paths[@]}"; do
            echo "::group::$path"
            reply=$(curl -sS --max-time 20 -A KSFCompanion/1.0 "https://ksf.surf$path")
            if [[ "$path" == /api/* ]]; then
              (jq -c . <<<"$reply" 2>/dev/null || printf '%s\n' "$reply") | head -c 20000
              echo
            else
              # A page of the site: where its scripts ask ksf.surf's API for data.
              for script in $(grep -oE '(https://ksf\.surf)?/[^"'\'' <>]+\.js' <<<"$reply" | sed 's|^https://ksf\.surf||' | sort -u); do
                sleep 1.2
                curl -sS --max-time 20 "https://ksf.surf$script" | grep -oE '.{0,80}/api/.{0,120}' || true
              done | sort -u
            fi
            echo "::endgroup::"
            # ksf.surf only takes about a request a second.
            sleep 1.2
          done

      - uses: cachix/install-nix-action@v31
        if: inputs.api == ''

      - name: Draw the dashboard from ksf.surf
        if: inputs.api == ''
        env:
          MAP: ${{ inputs.map }}
        run: |
          nix build .#ksf-companion
          export KSFC_DATA_DIR="$RUNNER_TEMP/ksfc"
          # ksf.surf only takes so many requests a minute: a map you name is all this run asks it about.
          if [ -n "$MAP" ]; then
            ./result/bin/ksf-companion --card "$MAP"
            ./result/bin/ksf-companion --preview "$MAP" map.png 1600 1080
            exit 0
          fi
          # The busiest KSF server right now, as if you were on it.
          ./result/bin/ksf-companion --preview live dashboard.png 1600 1080
          KSFC_PREVIEW_MODE=simple ./result/bin/ksf-companion --preview live dashboard-simple.png 1600 1080
          # And the in-game KSF card for a map, as text.
          ./result/bin/ksf-companion --card surf_utopia_njv

      - uses: actions/upload-artifact@v4
        if: inputs.api == ''
        with:
          name: screenshots
          path: '*.png'
