# Draws the dashboard from ksf.surf's live data on a fresh machine and keeps the pictures: a check that KSF Companion
# still reads ksf.surf right, and screenshots for docs/. Run it by hand from the Actions tab (it also runs when this
# file changes).
name: Screenshots

on:
  workflow_dispatch:
    inputs:
      map:
        description: 'Also draw this map and print its KSF card (e.g. surf_bugs)'
        required: false
        default: ''
      api:
        description: 'Or just print what ksf.surf answers at these paths (e.g. /api/maps/search/surf_bugs /maps/surf_bugs)'
        required: false
        default: ''
      find:
        description: 'For a page in those paths: what to look for in it and its scripts (a regex; by default where they call the API)'
        required: false
        default: '/api/'
      jq:
        description: 'For JSON in those paths: just this part of it (a jq filter)'
        required: false
        default: '.'
      server:
        description: 'Or ask game servers what they tell a server browser, as the server list asks private KSF servers (ip:port ...)'
        required: false
        default: ''
  push:
    paths: ['.github/workflows/screenshots.yml']

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Print what ksf.surf answers
        if: inputs.api != ''
        env:
          API: ${{ inputs.api }}
          FIND: ${{ inputs.find }}
          JQ: ${{ inputs.jq }}
        run: |
          read -ra paths <<<"$API"
          for path in "${paths[@]}"; do
            echo "::group::$path"
            curl -sS --max-time 20 -A KSFCompanion/1.0 -o reply -w 'HTTP %{http_code} %{content_type}\n' "https://ksf.surf$path"
            if [[ "$path" == /api/* ]]; then
              (jq -c "${JQ:-.}" reply 2>/dev/null || cat reply) | head -c 20000
              echo
            else
              # A page of the site: where it and its scripts mention $FIND, and the pages it links to.
              python3 -c 'if True:
                  import re, subprocess, sys, time
                  find = re.compile(sys.argv[1] or "/api/")
                  page = open("reply", encoding="utf-8", errors="replace").read()
                  def mentions(name, text):
                      seen = []
                      for m in find.finditer(text):
                          bit = text[max(0, m.start() - 80):m.end() + 160].replace("\n", " ")
                          if bit not in seen and len(seen) < 60:
                              seen.append(bit)
                              print(name + ": " + bit)
                  print("links: " + " ".join(sorted(set(re.findall(r"href=\"(/[^\"#?]*)", page)))))
                  mentions("page", page)
                  # Its scripts: the ones it loads, and its own (named in the data Next.js puts in the page).
                  scripts = set(re.findall(r"(/_next/static/[^\"\x27\\ <>]+?\.js)", page))
                  scripts |= {"/_next/" + s for s in re.findall(r"(?<![\w/])(static/chunks/[^\"\x27\\ <>]+?\.js)", page)}
                  for script in sorted(scripts):
                      time.sleep(1.2)
                      js = subprocess.run(["curl", "-sS", "--max-time", "20", "https://ksf.surf" + script], capture_output=True, text=True).stdout
                      mentions(script.rsplit("/", 1)[-1], js)
              ' "$FIND"
            fi
            echo "::endgroup::"
            # ksf.surf only takes about a request a second.
            sleep 1.2
          done

      - uses: cachix/install-nix-action@v31
        if: inputs.api == ''

      - name: Ask game servers
        if: inputs.api == '' && inputs.server != ''
        env:
          SERVER: ${{ inputs.server }}
        run: |
          nix build .#ksf-companion
          read -ra servers <<<"$SERVER"
          for server in "${servers[@]}"; do
            echo "::group::$server"
            ./result/bin/ksf-companion --server "$server" || true
            echo "::endgroup::"
          done

      - name: Draw the dashboard from ksf.surf
        if: inputs.api == '' && inputs.server == ''
        env:
          MAP: ${{ inputs.map }}
        run: |
          nix build .#ksf-companion
          export KSFC_DATA_DIR="$RUNNER_TEMP/ksfc"
          # ksf.surf only takes so many requests a minute: a map you name is all this run asks it about.
          if [ -n "$MAP" ]; then
            ./result/bin/ksf-companion --card "$MAP"
            ./result/bin/ksf-companion --preview "$MAP" map.png 1600 1080
            exit 0
          fi
          # The busiest KSF server right now, as if you were on it.
          ./result/bin/ksf-companion --preview live dashboard.png 1600 1080
          # And the in-game KSF card for a map, as text.
          ./result/bin/ksf-companion --card surf_utopia_njv

      - uses: actions/upload-artifact@v4
        if: inputs.api == '' && inputs.server == ''
        with:
          name: screenshots
          path: '*.png'
