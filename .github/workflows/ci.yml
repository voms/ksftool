# Builds the Nix package and runs its checks on every push and pull request: the app's own tests, the NixOS module,
# and a whole desktop in a VM (Home Manager service, tray icon, a stand-in CS:S).
name: CI

on:
  push:
  pull_request:

# It only reads the code.
permissions:
  contents: read

jobs:
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Nothing here pushes: the token isn't left in .git/config for the build to read.
          persist-credentials: false

      # Third-party actions are pinned to a commit: a tag can be moved to other code.
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          # The desktop test boots a VM.
          enable_kvm: true
          extra_nix_config: system-features = nixos-test benchmark big-parallel kvm

      - name: nix flake check
        run: nix flake check -L
